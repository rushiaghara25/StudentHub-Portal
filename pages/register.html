<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="D:\Learning\SEM 3\ITUE203\Practical\STUDENTHUB\CSS\style.css">
</head>
<body>
    
<h1>Student Registration</h1>

<p>
Create your StudentHub account and stay connected with
student services, events, and announcements.
</p>

<hr>

<form>

<label>Full Name:</label><br>
<input type="text" placeholder="Enter your name">
<br><br>

<label>Email Address:</label><br>
<input type="email" placeholder="Enter your email">
<br><br>

<label>Phone Number:</label><br>
<input type="text" placeholder="Enter your phone number">
<br><br>

<label>Date of Birth:</label><br>
<input type="date">
<br><br>

<label>Gender:</label><br>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
<br><br>

<label>Enrollment Number:</label><br>
<input type="text" placeholder="Enter enrollment number">
<br><br>

<label>Department:</label><br>
<select>
    <option>Computer Science</option>
    <option>Information Technology</option>
    <option>Commerce</option>
    <option>Management</option>
</select>

<br><br>

<label>Course:</label><br>
<input type="text" placeholder="Enter your course">
<br><br>

<label>Semester:</label><br>
<input type="text" placeholder="Enter semester">
<br><br>

<label>Password:</label><br>
<input type="password" placeholder="Create password">
<br><br>

<label>Confirm Password:</label><br>
<input type="password" placeholder="Confirm password">
<br><br>

<button type="submit">Register</button>
<button type="reset">Clear</button>

</form>
</body>
</html>
