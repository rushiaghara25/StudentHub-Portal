<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Login</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>
<h1>StudentHub Login</h1>

<p>
    Login to continue to your StudentHub dashboard.
</p>

<div id="notification"></div>
<form action="dashboard.html" method="get" id="login-form">

    <label>Email Address:</label>
        <input type="email" id="email" placeholder="Enter Your Email">

    <label>Password:</label>
        <input type="password" id="password" placeholder="Enter Your Password">

    <button type="submit" id="login-btn">Login</button>   
    <button type="reset" id="clear-btn">Clear</button>
</form>

<p>
    New student?
    <a href="register.php">Register here</a>
</p>

<p>
    <a href="../index.html">Back to StudentHub</a>
</p>
<script src="../js/script.js"></script>

</body>
</html>
